<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTD Executivo — André Delamata</title>
<meta name="description" content="Painel de controle pessoal de tarefas, FUPs, agenda e histórico — sincronizado em tempo real via Supabase, acessível também pelo celular.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23122B40'/%3E%3Ctext x='12' y='17' font-size='13' font-family='Arial,Helvetica,sans-serif' font-weight='700' fill='%23FFD400' text-anchor='middle'%3EGT%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/reset.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<div id="auth-root"></div>
<div class="app-shell" id="app-shell" style="display:none;">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <div class="sidebar__brand-mark" aria-hidden="true">GT</div>
      <div class="sidebar__brand-text">
        <strong>GTD Executivo</strong>
        <span>André Delamata</span>
      </div>
    </div>
    <nav class="sidebar__nav" id="sidebar-nav" aria-label="Navegação principal"></nav>
    <div class="sidebar__footer">
      <button type="button" class="btn btn--ghost btn--sm" id="sidebar-toggle" style="width:100%;" aria-label="Recolher menu lateral"></button>
    </div>
  </aside>

  <header class="topbar">
    <button type="button" class="btn btn--icon btn--ghost" id="mobile-menu-btn" aria-label="Abrir menu" style="display:none;"></button>
    <div class="topbar__date" id="topbar-date"></div>
    <div class="topbar__search">
      <input type="search" id="global-search-trigger" placeholder="Buscar (Ctrl+K)" aria-label="Busca global" autocomplete="off">
      <span class="kbd">Ctrl K</span>
    </div>
    <div class="topbar__actions" id="topbar-actions"></div>
  </header>

  <main class="main" id="view-root" tabindex="-1" aria-live="polite"></main>
</div>

<div id="modal-root"></div>

<noscript>Este sistema requer JavaScript habilitado para funcionar.</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
